name: Validate site

on:
  pull_request:
    paths:
      - 'site/**'
  push:
    branches: [ 'main' ]
    paths:
      - 'site/**'

jobs:
  lint-site:
    name: Lint site (super-linter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run super-linter on `site/`
        uses: github/super-linter@b807e99ddd37e444d189cfd2c2ca1274d8ae8ef1 # v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: false
          FILTER_REGEX_INCLUDE: '^site/'

  link-check:
    name: Link check (lychee)
    runs-on: ubuntu-latest
    needs: lint-site
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run lychee link checker against site folder
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: "site --timeout 10"

  seo-check:
    name: SEO / Open Graph validation
    runs-on: ubuntu-latest
    needs: link-check
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Run SEO validator
        run: |
          python site/scripts/validate_seo.py
