name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  go-test:
    name: "Go: tests_and_lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ${{ env.GOMODCACHE }}
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run go vet
        run: go vet ./...

      - name: Install and run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          # Block only NEW lint findings. The tree carries ~600 grandfathered
          # issues (see docs/MATURITY_ASSESSMENT.md); only-new-issues fails the
          # build on regressions introduced by a change without requiring the
          # full backlog to be fixed first. Was previously advisory
          # (continue-on-error) — now blocking for new issues.
          only-new-issues: true

      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: Run unit tests
        run: go test ./internal/... -v

      - name: Lockstep check (recovery scripts ↔ migration SQL)
        run: go test -count=1 ./scripts/recover/...

      - name: Generator drift check (protectedUsers.js)
        run: |
          go run ./cmd/gen-protected-emails/
          if ! git diff --exit-code -- web/src/utils/protectedUsers.js; then
            echo '::error::web/src/utils/protectedUsers.js is out of sync with pkg/security/protected_users.go.'
            echo '::error::Run `make gen-protected-emails` and commit the result.'
            exit 1
          fi

      - name: Doc code-block syntax check
        run: |
          set -e
          for f in docs/security/PROTECTED_USERS.md docs/security/PROTECTED_USERS_RECOVERY.md docs/security/THREAT_MODEL.md; do
            echo "Checking $f..."
            # Extract bash blocks; run bash -n on each (strict — syntax errors fail the build)
            awk '/^```bash$/,/^```$/' "$f" | sed '/^```/d' > /tmp/check.sh
            if [ -s /tmp/check.sh ]; then
              bash -n /tmp/check.sh || { echo "::error::syntax error in bash blocks of $f"; exit 1; }
            fi
            # Extract SQL blocks; parse via sqlite3 in-memory (informational only)
            # NOTE: sqlite3 is the most permissive dialect; this catches typos but will
            # produce parse notes for postgres-specific (e.g. NOW() - INTERVAL, ::json)
            # and mysql-specific syntax. Per-dialect linting is out of scope — actual SQL
            # is tested by the migration integration tests.
            awk '/^```sql$/,/^```$/' "$f" | sed '/^```/d' > /tmp/check.sql
            if [ -s /tmp/check.sql ]; then
              sqlite3 :memory: ".read /tmp/check.sql" 2>/dev/null || echo "::warning::SQL parse note for $f (may contain postgres/mysql-specific syntax — informational only)"
            fi
          done

  integration:
    name: Integration tests (DB matrix)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: [sqlite3, postgres, mysql]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: actalog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval=5s --health-timeout=2s --health-retries=10

      mysql:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: example
          MYSQL_DATABASE: actalog_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -uroot -pexample" --health-interval=5s --health-timeout=2s --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'

      - name: Run integration tests (matrix)
        env:
          CGO_ENABLED: 1
        run: |
          if [ "${{ matrix.db }}" = "sqlite3" ]; then
            echo "Running integration tests against sqlite3"
            go test ./test/integration -run Test -v
          elif [ "${{ matrix.db }}" = "postgres" ]; then
            echo "Running integration tests against Postgres service"
            dsn="host=localhost port=5432 user=postgres password=postgres dbname=actalog_test sslmode=disable"
            go test ./test/integration -run Test -v -args -db=postgres -dsn="$dsn"
          else
            echo "Running integration tests against MariaDB service"
            dsn="root:example@tcp(localhost:3306)/actalog_test?parseTime=true&multiStatements=true"
            go test ./test/integration -run Test -v -args -db=mysql -dsn="$dsn"
          fi

  web-build:
    name: "Web: build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      # Pin npm to the version that generated web/package-lock.json.
      # setup-node's bundled npm floats with the node 24.x patch release, and a
      # newer npm resolves the rolldown wasm-fallback @emnapi optional deps into
      # a different lockfile shape, breaking `npm ci`. Keep this in lockstep with
      # the "packageManager" field in web/package.json.
      - name: Pin npm to lockfile version
        run: npm i -g npm@11.16.0

      - name: Cache node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install web deps
        run: |
          cd web
          npm ci

      - name: Build web
        run: |
          cd web
          npm run build --if-present

      - name: Dependency audit (npm)
        run: |
          cd web
          # Fail the build on known high/critical advisories in web deps.
          npm audit --audit-level=high

  web-test:
    name: "Web: test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      # Pin npm to the version that generated web/package-lock.json.
      # setup-node's bundled npm floats with the node 24.x patch release, and a
      # newer npm resolves the rolldown wasm-fallback @emnapi optional deps into
      # a different lockfile shape, breaking `npm ci`. Keep this in lockstep with
      # the "packageManager" field in web/package.json.
      - name: Pin npm to lockfile version
        run: npm i -g npm@11.16.0

      - name: Cache node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install web deps
        run: cd web && npm ci

      - name: Run frontend tests
        run: cd web && npm run test:run
