  <text x="215" y="235" fill="#666" font-family="system-ui" font-size="14" text-anchor="middle">24</text>
  <text x="270" y="235" fill="#666" font-family="system-ui" font-size="14" text-anchor="middle">25</text>
  <text x="325" y="235" fill="#666" font-family="system-ui" font-size="14" text-anchor="middle">26</text>
  <text x="380" y="235" fill="#666" font-family="system-ui" font-size="14" text-anchor="middle">27</text>

