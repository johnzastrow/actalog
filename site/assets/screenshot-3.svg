  <text x="105" y="85" fill="#666" font-family="system-ui" font-size="12" text-anchor="middle">Mon</text>
  <text x="160" y="85" fill="#666" font-family="system-ui" font-size="12" text-anchor="middle">Tue</text>
  <text x="215" y="85" fill="#666" font-family="system-ui" font-size="12" text-anchor="middle">Wed</text>
