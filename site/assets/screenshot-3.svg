  <rect x="20" y="350" width="560" height="40" rx="8" fill="#0f1d2e"/>
  <text x="35" y="375" fill="#e0e0e0" font-family="system-ui" font-size="14" font-weight="600">Today: Back Squat 5x5 @ 285 lbs</text>
  <text x="520" y="375" fill="#00bcd4" font-family="system-ui" font-size="12">View</text>
