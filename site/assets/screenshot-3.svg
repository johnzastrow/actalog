  <text x="325" y="155" fill="#e0e0e0" font-family="system-ui" font-size="14" text-anchor="middle">12</text>
  <circle cx="325" cy="165" r="3" fill="#00bcd4"/>
  <text x="380" y="155" fill="#e0e0e0" font-family="system-ui" font-size="14" text-anchor="middle">13</text>

