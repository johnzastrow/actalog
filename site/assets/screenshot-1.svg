<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- Performance Analytics Screen Mockup -->
  <rect width="100%" height="100%" rx="16" fill="#0a1628"/>

  <!-- Header -->
  <rect x="0" y="0" width="600" height="50" fill="#0f1d2e"/>
  <text x="30" y="32" fill="#e0e0e0" font-family="system-ui" font-size="18" font-weight="bold">Performance Analytics</text>

  <!-- PR Summary Cards -->
  <rect x="20" y="70" width="175" height="80" rx="10" fill="#0f1d2e"/>
  <text x="35" y="95" fill="#666" font-family="system-ui" font-size="11">TOTAL PRs</text>
  <text x="35" y="130" fill="#ffc107" font-family="system-ui" font-size="32" font-weight="bold">47</text>

  <rect x="212" y="70" width="175" height="80" rx="10" fill="#0f1d2e"/>
  <text x="227" y="95" fill="#666" font-family="system-ui" font-size="11">THIS MONTH</text>
  <text x="227" y="130" fill="#00bcd4" font-family="system-ui" font-size="32" font-weight="bold">8</text>

  <rect x="405" y="70" width="175" height="80" rx="10" fill="#0f1d2e"/>
  <text x="420" y="95" fill="#666" font-family="system-ui" font-size="11">CURRENT STREAK</text>
  <text x="420" y="130" fill="#00e676" font-family="system-ui" font-size="32" font-weight="bold">12 days</text>

  <!-- Chart Area -->
  <rect x="20" y="165" width="560" height="150" rx="10" fill="#0f1d2e"/>
  <text x="35" y="190" fill="#e0e0e0" font-family="system-ui" font-size="14" font-weight="600">Back Squat Progress (6 months)</text>

  <!-- Chart Grid -->
  <line x1="50" y1="290" x2="550" y2="290" stroke="#333" stroke-width="1"/>
  <line x1="50" y1="210" x2="50" y2="290" stroke="#333" stroke-width="1"/>
  <text x="35" y="220" fill="#666" font-family="system-ui" font-size="9">300</text>
  <text x="35" y="255" fill="#666" font-family="system-ui" font-size="9">250</text>
  <text x="35" y="290" fill="#666" font-family="system-ui" font-size="9">200</text>

  <!-- Data Line -->
  <polyline points="80,280 150,265 220,250 290,240 360,255 430,235 500,215" fill="none" stroke="#00bcd4" stroke-width="2.5"/>
  <circle cx="80" cy="280" r="4" fill="#00bcd4"/>
  <circle cx="150" cy="265" r="4" fill="#00bcd4"/>
  <circle cx="220" cy="250" r="4" fill="#00bcd4"/>
  <circle cx="290" cy="240" r="4" fill="#00bcd4"/>
  <circle cx="360" cy="255" r="4" fill="#00bcd4"/>
  <circle cx="430" cy="235" r="4" fill="#00bcd4"/>
  <circle cx="500" cy="215" r="6" fill="#ffc107"/>
  <text x="500" y="205" fill="#ffc107" font-family="system-ui" font-size="10" text-anchor="middle">PR!</text>

  <!-- Movement Stats -->
  <text x="20" y="340" fill="#666" font-family="system-ui" font-size="11">TOP LIFTS</text>

  <rect x="20" y="350" width="180" height="40" rx="8" fill="#0f1d2e"/>
  <text x="35" y="375" fill="#e0e0e0" font-family="system-ui" font-size="13">Back Squat</text>
  <text x="165" y="375" fill="#00bcd4" font-family="system-ui" font-size="13" font-weight="bold">315</text>

  <rect x="210" y="350" width="180" height="40" rx="8" fill="#0f1d2e"/>
  <text x="225" y="375" fill="#e0e0e0" font-family="system-ui" font-size="13">Deadlift</text>
  <text x="355" y="375" fill="#00bcd4" font-family="system-ui" font-size="13" font-weight="bold">405</text>

  <rect x="400" y="350" width="180" height="40" rx="8" fill="#0f1d2e"/>
  <text x="415" y="375" fill="#e0e0e0" font-family="system-ui" font-size="13">Clean &amp; Jerk</text>
  <text x="545" y="375" fill="#00bcd4" font-family="system-ui" font-size="13" font-weight="bold">225</text>
</svg>
