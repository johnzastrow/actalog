<svg xmlns="http://www.w3.org/2000/svg" width="400" height="700" viewBox="0 0 400 700">
  <!-- Phone frame -->
  <rect width="100%" height="100%" rx="40" fill="#1a1a2e"/>
  <rect x="10" y="10" width="380" height="680" rx="32" fill="#0a1628"/>

  <!-- Status bar -->
  <rect x="20" y="20" width="360" height="30" fill="#0f1d2e"/>
  <text x="30" y="40" fill="#00bcd4" font-family="system-ui" font-size="12">9:41</text>
  <text x="340" y="40" fill="#00bcd4" font-family="system-ui" font-size="12">100%</text>

  <!-- Header -->
  <rect x="20" y="60" width="360" height="56" fill="#0f1d2e"/>
  <text x="40" y="95" fill="#00bcd4" font-family="Bebas Neue, system-ui" font-size="24" font-weight="bold">ACTALOG</text>
  <circle cx="350" cy="88" r="16" fill="#ffc107"/>
  <text x="345" y="94" fill="#0a1628" font-family="system-ui" font-size="20" font-weight="bold">+</text>

  <!-- Dashboard content -->
  <rect x="30" y="130" width="340" height="100" rx="12" fill="#0f1d2e"/>
  <text x="50" y="160" fill="#e0e0e0" font-family="system-ui" font-size="14">This Week</text>
  <text x="50" y="200" fill="#00bcd4" font-family="system-ui" font-size="36" font-weight="bold">5</text>
  <text x="100" y="200" fill="#666" font-family="system-ui" font-size="14">workouts</text>
  <rect x="250" y="150" width="100" height="60" rx="8" fill="#00bcd4" opacity="0.2"/>
  <text x="270" y="185" fill="#00bcd4" font-family="system-ui" font-size="12">+2 PRs</text>

  <!-- Recent workouts -->
  <text x="30" y="260" fill="#666" font-family="system-ui" font-size="12" text-transform="uppercase">Recent Workouts</text>

  <rect x="30" y="275" width="340" height="80" rx="12" fill="#0f1d2e"/>
  <circle cx="60" cy="315" r="20" fill="#ffc107"/>
  <text x="55" y="320" fill="#0a1628" font-family="system-ui" font-size="16" font-weight="bold">F</text>
  <text x="90" y="305" fill="#e0e0e0" font-family="system-ui" font-size="16" font-weight="600">Fran</text>
  <text x="90" y="325" fill="#666" font-family="system-ui" font-size="12">21-15-9 Thrusters, Pull-ups</text>
  <text x="90" y="345" fill="#00bcd4" font-family="system-ui" font-size="12">3:42 - PR!</text>

  <rect x="30" y="365" width="340" height="80" rx="12" fill="#0f1d2e"/>
  <circle cx="60" cy="405" r="20" fill="#00bcd4"/>
  <text x="55" y="410" fill="#0a1628" font-family="system-ui" font-size="16" font-weight="bold">B</text>
  <text x="90" y="395" fill="#e0e0e0" font-family="system-ui" font-size="16" font-weight="600">Back Squat</text>
  <text x="90" y="415" fill="#666" font-family="system-ui" font-size="12">5x5 @ 225 lbs</text>
  <text x="90" y="435" fill="#666" font-family="system-ui" font-size="12">Yesterday</text>

  <rect x="30" y="455" width="340" height="80" rx="12" fill="#0f1d2e"/>
  <circle cx="60" cy="495" r="20" fill="#ff6b35"/>
  <text x="55" y="500" fill="#fff" font-family="system-ui" font-size="16" font-weight="bold">C</text>
  <text x="90" y="485" fill="#e0e0e0" font-family="system-ui" font-size="16" font-weight="600">Cindy</text>
  <text x="90" y="505" fill="#666" font-family="system-ui" font-size="12">20 min AMRAP</text>
  <text x="90" y="525" fill="#666" font-family="system-ui" font-size="12">18 rounds + 5 reps</text>

  <!-- Bottom nav -->
  <rect x="20" y="610" width="360" height="70" fill="#0f1d2e"/>
  <g fill="#666">
    <rect x="55" y="625" width="30" height="30" rx="4" fill="#00bcd4" opacity="0.2"/>
    <text x="70" y="645" fill="#00bcd4" font-family="system-ui" font-size="16" text-anchor="middle">&#8962;</text>
    <text x="70" y="665" fill="#00bcd4" font-family="system-ui" font-size="10" text-anchor="middle">Home</text>

    <text x="145" y="645" fill="#666" font-family="system-ui" font-size="16" text-anchor="middle">&#128200;</text>
    <text x="145" y="665" fill="#666" font-family="system-ui" font-size="10" text-anchor="middle">Stats</text>

    <text x="255" y="645" fill="#666" font-family="system-ui" font-size="16" text-anchor="middle">&#127939;</text>
    <text x="255" y="665" fill="#666" font-family="system-ui" font-size="10" text-anchor="middle">WODs</text>

    <text x="330" y="645" fill="#666" font-family="system-ui" font-size="16" text-anchor="middle">&#128100;</text>
    <text x="330" y="665" fill="#666" font-family="system-ui" font-size="10" text-anchor="middle">Profile</text>
  </g>
</svg>
