<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- WOD Library Screen Mockup -->
  <rect width="100%" height="100%" rx="16" fill="#0a1628"/>

  <!-- Header -->
  <rect x="0" y="0" width="600" height="50" fill="#0f1d2e"/>
  <text x="30" y="32" fill="#e0e0e0" font-family="system-ui" font-size="18" font-weight="bold">WOD Library</text>
  <text x="520" y="32" fill="#00bcd4" font-family="system-ui" font-size="14">314 WODs</text>

  <!-- Search Bar -->
  <rect x="20" y="60" width="560" height="40" rx="8" fill="#0f1d2e" stroke="#333"/>
  <text x="40" y="85" fill="#666" font-family="system-ui" font-size="14">Search benchmark WODs...</text>

  <!-- Filter Chips -->
  <rect x="20" y="110" width="60" height="26" rx="13" fill="#00bcd4"/>
  <text x="35" y="128" fill="#0a1628" font-family="system-ui" font-size="11" font-weight="600">Girls</text>

  <rect x="90" y="110" width="65" height="26" rx="13" fill="#0f1d2e" stroke="#333"/>
  <text x="103" y="128" fill="#e0e0e0" font-family="system-ui" font-size="11">Heroes</text>

  <rect x="165" y="110" width="55" height="26" rx="13" fill="#0f1d2e" stroke="#333"/>
  <text x="178" y="128" fill="#e0e0e0" font-family="system-ui" font-size="11">Open</text>

  <rect x="230" y="110" width="70" height="26" rx="13" fill="#0f1d2e" stroke="#333"/>
  <text x="242" y="128" fill="#e0e0e0" font-family="system-ui" font-size="11">AMRAP</text>

  <rect x="310" y="110" width="75" height="26" rx="13" fill="#0f1d2e" stroke="#333"/>
  <text x="322" y="128" fill="#e0e0e0" font-family="system-ui" font-size="11">For Time</text>

  <!-- WOD Cards - 2 column grid -->
  <rect x="20" y="150" width="275" height="110" rx="10" fill="#0f1d2e"/>
  <text x="35" y="175" fill="#ffc107" font-family="system-ui" font-size="16" font-weight="bold">Fran</text>
  <text x="35" y="195" fill="#e0e0e0" font-family="system-ui" font-size="12">21-15-9</text>
  <text x="35" y="215" fill="#666" font-family="system-ui" font-size="11">Thrusters (95/65)</text>
  <text x="35" y="235" fill="#666" font-family="system-ui" font-size="11">Pull-ups</text>
  <rect x="230" y="160" width="55" height="22" rx="4" fill="#00bcd4" opacity="0.2"/>
  <text x="242" y="176" fill="#00bcd4" font-family="system-ui" font-size="10">For Time</text>

  <rect x="305" y="150" width="275" height="110" rx="10" fill="#0f1d2e"/>
  <text x="320" y="175" fill="#ffc107" font-family="system-ui" font-size="16" font-weight="bold">Grace</text>
  <text x="320" y="195" fill="#e0e0e0" font-family="system-ui" font-size="12">30 reps for time</text>
  <text x="320" y="215" fill="#666" font-family="system-ui" font-size="11">Clean &amp; Jerk (135/95)</text>
  <rect x="515" y="160" width="55" height="22" rx="4" fill="#00bcd4" opacity="0.2"/>
  <text x="527" y="176" fill="#00bcd4" font-family="system-ui" font-size="10">For Time</text>

  <rect x="20" y="270" width="275" height="110" rx="10" fill="#0f1d2e"/>
  <text x="35" y="295" fill="#ffc107" font-family="system-ui" font-size="16" font-weight="bold">Cindy</text>
  <text x="35" y="315" fill="#e0e0e0" font-family="system-ui" font-size="12">20 min AMRAP</text>
  <text x="35" y="335" fill="#666" font-family="system-ui" font-size="11">5 Pull-ups, 10 Push-ups</text>
  <text x="35" y="355" fill="#666" font-family="system-ui" font-size="11">15 Air Squats</text>
  <rect x="230" y="280" width="55" height="22" rx="4" fill="#ff6b35" opacity="0.2"/>
  <text x="240" y="296" fill="#ff6b35" font-family="system-ui" font-size="10">AMRAP</text>

  <rect x="305" y="270" width="275" height="110" rx="10" fill="#0f1d2e"/>
  <text x="320" y="295" fill="#ffc107" font-family="system-ui" font-size="16" font-weight="bold">Murph</text>
  <text x="320" y="315" fill="#e0e0e0" font-family="system-ui" font-size="12">For Time (w/ vest)</text>
  <text x="320" y="335" fill="#666" font-family="system-ui" font-size="11">1 mile Run, 100 Pull-ups</text>
  <text x="320" y="355" fill="#666" font-family="system-ui" font-size="11">200 Push-ups, 300 Squats...</text>
  <rect x="515" y="280" width="55" height="22" rx="4" fill="#00bcd4" opacity="0.2"/>
  <text x="527" y="296" fill="#00bcd4" font-family="system-ui" font-size="10">For Time</text>
</svg>
